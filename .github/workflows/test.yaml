name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Check frontend JS syntax
        run: |
          for f in custom_components/quizrooms/frontend/*.js custom_components/quizrooms/frontend/assets/js/*.js; do
            node --check "$f"
          done

      - name: Validate SVGs
        run: |
          python3 -c "import pathlib, xml.etree.ElementTree as ET
          for s in pathlib.Path('custom_components/quizrooms').rglob('*.svg'):
              ET.fromstring(s.read_text(encoding='utf-8'))
          print('SVGs OK')"
